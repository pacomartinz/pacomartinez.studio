<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paco Martínez — Director & Filmmaker</title>

    <meta
        name="description"
        content="Paco Martínez — Director & Filmmaker. Sport, Lifestyle & Hospitality. Seville, Spain."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <!-- =========================
             HERO
        ========================== -->

        <section class="hero" id="top">

            <!-- VIDEO + POSTER -->
            <div class="hero-video">

                <!-- Imagen visible mientras carga Vimeo -->
                <div class="hero-poster"></div>

                <!-- Vimeo -->
                <iframe
                    id="hero-vimeo"
                    src="https://player.vimeo.com/video/1218323438?background=1&autoplay=1&muted=1&loop=1&autopause=0"
                    frameborder="0"
                    allow="autoplay; fullscreen; picture-in-picture"
                    title="Paco Martínez — Hero Film"
                ></iframe>

            </div>


            <!-- HEADER -->
            <header class="hero-header">

                <a class="hero-logo" href="#top">
                    PACO MARTÍNEZ STUDIO
                </a>

                <nav class="hero-nav" aria-label="Navegación principal">
                    <a href="#work">Work</a>
                    <a href="#about">About</a>
                    <a href="#contact">Contact</a>
                </nav>

            </header>


            <!-- HERO CONTENT -->
            <div class="hero-content">

                <h1>
                    PACO<br>
                    MARTÍNEZ
                </h1>

                <p class="hero-role">
                    Director &amp; Filmmaker
                </p>

                <p class="hero-fields">
                    Sport · Lifestyle · Hospitality
                </p>

                <p class="hero-location">
                    Seville, Spain
                </p>

            </div>

        </section>


        <!-- =========================
             FUTURAS SECCIONES
        ========================== -->

        <section id="work"></section>

        <section id="about"></section>

        <section id="contact"></section>

    </main>


    <!-- VIMEO PLAYER API -->
    <script src="https://player.vimeo.com/api/player.js"></script>

    <script>
        const heroIframe = document.getElementById("hero-vimeo");
        const heroPlayer = new Vimeo.Player(heroIframe);

        heroPlayer.on("playing", function () {
            heroIframe.classList.add("is-playing");
        });
    </script>

</body>

</html>
