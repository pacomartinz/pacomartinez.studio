<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Paco Martínez — Director & Filmmaker</title>

    <meta
        name="description"
        content="Paco Martínez — Director & Filmmaker. Sport, Lifestyle & Hospitality. Seville, Spain."
    >

    <!-- Precargamos el poster -->
    <link
        rel="preload"
        as="image"
        href="images/hero-poster.jpg"
        fetchpriority="high"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <!-- =================================================
             HERO
        ================================================== -->

        <section class="hero" id="top">

            <!-- HERO MEDIA -->

            <div class="hero-media">

                <video
                    class="hero-video"
                    autoplay
                    muted
                    loop
                    playsinline
                    preload="auto"
                    poster="images/hero-poster.jpg"
                    aria-hidden="true"
                >
                    <source
                        src="video/hero.mp4"
                        type="video/mp4"
                    >
                </video>

            </div>


            <!-- =================================================
                 HEADER
            ================================================== -->

            <header class="hero-header">

                <a
                    class="hero-logo"
                    href="#top"
                >
                    PACO MARTÍNEZ STUDIO
                </a>

                <nav
                    class="hero-nav"
                    aria-label="Navegación principal"
                >
                    <a href="#work">Work</a>
                    <a href="#about">About</a>
                    <a href="#contact">Contact</a>
                </nav>

            </header>


            <!-- =================================================
                 HERO CONTENT
            ================================================== -->

            <div class="hero-content">

                <h1>
                    PACO<br>
                    MARTÍNEZ
                </h1>

                <p class="hero-role">
                    Director &amp; Filmmaker
                </p>

                <p class="hero-fields">
                    Sport · Lifestyle · Hospitality
                </p>

                <p class="hero-location">
                    Seville, Spain
                </p>

            </div>

        </section>


        <!-- =================================================
             FUTURAS SECCIONES
        ================================================== -->

        <section id="work"></section>

        <section id="about"></section>

        <section id="contact"></section>

    </main>


    <!-- Nuestro JavaScript -->
    <script src="script.js"></script>

</body>

</html>
