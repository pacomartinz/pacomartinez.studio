<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Paco Martínez — Director & Filmmaker</title>

    <meta
        name="description"
        content="Paco Martínez — Director & Filmmaker. Sport, Lifestyle & Hospitality. Seville, Spain."
    >

    <!-- El navegador sabe desde el principio que esta imagen es prioritaria -->
    <link
        rel="preload"
        as="image"
        href="images/hero-poster.jpg"
        fetchpriority="high"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <!-- =========================
             HERO
        ========================== -->

        <section class="hero" id="top">

            <div class="hero-media">

                <!--
                    POSTER REAL.
                    Se carga antes que Vimeo.
                -->
                <img
                    id="hero-poster"
                    class="hero-poster"
                    src="images/hero-poster.jpg"
                    alt=""
                    fetchpriority="high"
                    loading="eager"
                >


                <!--
                    VIMEO.

                    De momento NO cargamos Vimeo.
                    La URL real está en data-src.
                -->
                <iframe
                    id="hero-vimeo"
                    class="hero-vimeo"
                    src="about:blank"
                    data-src="https://player.vimeo.com/video/1218323438?background=1&autoplay=1&muted=1&loop=1&autopause=0&playsinline=1"
                    frameborder="0"
                    allow="autoplay; fullscreen; picture-in-picture"
                    title="Paco Martínez — Hero Film"
                ></iframe>

            </div>


            <!-- HEADER -->
            <header class="hero-header">

                <a class="hero-logo" href="#top">
                    PACO MARTÍNEZ STUDIO
                </a>

                <nav
                    class="hero-nav"
                    aria-label="Navegación principal"
                >
                    <a href="#work">Work</a>
                    <a href="#about">About</a>
                    <a href="#contact">Contact</a>
                </nav>

            </header>


            <!-- HERO CONTENT -->
            <div class="hero-content">

                <h1>
                    PACO<br>
                    MARTÍNEZ
                </h1>

                <p class="hero-role">
                    Director &amp; Filmmaker
                </p>

                <p class="hero-fields">
                    Sport · Lifestyle · Hospitality
                </p>

                <p class="hero-location">
                    Seville, Spain
                </p>

            </div>

        </section>


        <!-- FUTURAS SECCIONES -->

        <section id="work"></section>

        <section id="about"></section>

        <section id="contact"></section>

    </main>


    <!-- VIMEO API -->
    <script src="https://player.vimeo.com/api/player.js"></script>


    <script>

        const heroPoster = document.getElementById("hero-poster");
        const heroIframe = document.getElementById("hero-vimeo");

        let vimeoStarted = false;


        function loadHeroVideo() {

            if (vimeoStarted) return;

            vimeoStarted = true;


            /*
            Vimeo SOLO empieza a cargarse
            cuando el poster ya está disponible.
            */

            heroIframe.src = heroIframe.dataset.src;


            const player = new Vimeo.Player(heroIframe);

            let videoRevealed = false;


            /*
            No mostramos el iframe simplemente
            cuando Vimeo dice "playing".

            Esperamos hasta que el vídeo lleve
            realmente unos frames reproduciéndose.
            */

            player.on("timeupdate", function(data) {

                if (
                    !videoRevealed &&
                    data.seconds >= 0.7
                ) {

                    videoRevealed = true;


                    /*
                    Esperamos dos frames del navegador
                    antes de hacer visible Vimeo.
                    */

                    requestAnimationFrame(function() {

                        requestAnimationFrame(function() {

                            heroIframe.classList.add("is-ready");

                        });

                    });

                }

            });

        }


        /*
        Si el poster ya estaba en caché,
        cargamos Vimeo inmediatamente.

        Si no, esperamos al evento load.
        */

        if (
            heroPoster.complete &&
            heroPoster.naturalWidth > 0
        ) {

            loadHeroVideo();

        } else {

            heroPoster.addEventListener(
                "load",
                loadHeroVideo,
                { once: true }
            );

        }


        /*
        Fallback por si hubiera algún error
        cargando el poster.
        */

        heroPoster.addEventListener(
            "error",
            loadHeroVideo,
            { once: true }
        );

    </script>

</body>

</html>
