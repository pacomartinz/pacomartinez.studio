<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paco Martínez — Director & Filmmaker</title>

    <meta
        name="description"
        content="Paco Martínez — Director & Filmmaker. Sport, Lifestyle & Hospitality. Seville, Spain."

    <link rel="stylesheet" href="style.css">

<body>

    <main>

        <!-- HERO -->
        <section class="hero" id="top">

            <!-- Vimeo background video -->

            <header class="hero-header">

                <a class="hero-logo" href="#top">

                <nav class="hero-nav" aria-label="Navegación principal">
                    <a href="#work">Work</a>
                    <a href="#about">About</a>

            </header>

            <div class="hero-content">

                <h1>
                    PACO<br>
                    MARTÍNEZ

                <p class="hero-role">
                    Director &amp; Filmmaker

                <p class="hero-location">
                    Seville, Spain

        <!-- El resto de la web irá aquí -->

        <section id="about"></section>
